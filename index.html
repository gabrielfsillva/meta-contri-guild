<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Metas - Guilda</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #090d16;
      --bg-card: rgba(30, 41, 59, 0.7);
      --bg-card-hover: rgba(51, 65, 85, 0.8);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-gradient: linear-gradient(135deg, #a855f7 0%, #6366f1 50%, #3b82f6 100%);
      --accent-purple: #8b5cf6;
      --accent-gold: #fbbf24;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --danger: #f43f5e;
      --danger-bg: rgba(244, 63, 94, 0.12);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(139, 92, 246, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      padding: 40px 20px;
      min-height: 100vh;
    }

    .container { max-width: 1280px; margin: 0 auto; }

    /* Header */
    header {
      margin-bottom: 30px;
      text-align: center;
    }

    .header-title h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      letter-spacing: -0.5px;
    }

    .header-title p { color: var(--text-muted); font-size: 0.95rem; margin-top: 6px; }

    /* Dropzone Estilizada */
    .dropzone {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 2px dashed var(--border-color);
      border-radius: 16px;
      padding: 35px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent-purple);
      background: rgba(139, 92, 246, 0.06);
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(139, 92, 246, 0.15);
    }

    .dropzone i { font-size: 2.8rem; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; }
    .dropzone p { font-size: 1rem; font-weight: 500; color: var(--text-main); }
    .dropzone span { color: var(--accent-purple); font-weight: 600; }
    #fileInput { display: none; }

    /* Grid de Métricas */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .metric-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s, border-color 0.2s;
    }

    .metric-card:hover {
      transform: translateY(-3px);
      border-color: var(--border-glow);
    }

    .metric-info h3 { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
    .metric-info p { font-size: 2rem; font-weight: 800; margin-top: 6px; letter-spacing: -0.5px; }
    
    .metric-icon {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    /* Pódio */
    .podium-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .podium-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px 24px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
    }

    .podium-card.first { border-color: rgba(251, 191, 36, 0.4); background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(251, 191, 36, 0.05)); }
    .podium-card.second { border-color: rgba(148, 163, 184, 0.4); }
    .podium-card.third { border-color: rgba(180, 83, 9, 0.4); }

    .podium-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .first .podium-icon { background: rgba(251, 191, 36, 0.15); color: var(--accent-gold); box-shadow: 0 0 20px rgba(251, 191, 36, 0.2); }
    .second .podium-icon { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; }
    .third .podium-icon { background: rgba(180, 83, 9, 0.15); color: #d97706; }

    /* Container da Tabela */
    .table-container {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    /* Cabeçalho unificado e moderno integrado na tabela */
    .table-header {
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 20px;
      background: rgba(15, 23, 42, 0.4);
    }

    .table-title {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .controls-wrapper {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 10px;
      transition: border-color 0.2s;
    }

    .control-group:hover { border-color: var(--accent-purple); }
    .control-group label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }

    .control-group input, .control-group select {
      background: transparent;
      border: none;
      color: var(--text-main);
      outline: none;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .control-group input[type="number"] { width: 70px; }
    .control-group select option { background: var(--bg-primary); color: var(--text-main); }

    .search-box {
      position: relative;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 6px 12px 6px 36px;
      transition: border-color 0.2s;
    }

    .search-box:hover, .search-box:focus-within { border-color: var(--accent-purple); }

    .search-box input {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
      width: 180px;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: rgba(15, 23, 42, 0.6); padding: 16px 24px; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; }
    td { padding: 16px 24px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
    tr:hover td { background-color: rgba(255, 255, 255, 0.02); }

    .badge {
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.3px;
    }

    .badge-success { background: var(--success-bg); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(244, 63, 94, 0.3); }

    .progress-bar-bg {
      background: rgba(15, 23, 42, 0.8);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      width: 140px;
      margin-top: 6px;
      border: 1px solid var(--border-color);
    }
    .progress-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
    .detail-text { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; font-weight: 500; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-title">
        <h1><i class="fa-solid fa-shield-halved"></i> Painel de Metas da Guilda</h1>
        <!--<p id="guildInfo">Arraste o arquivo JSON ou Excel da guilda para iniciar a verificação</p> -->
      </div>
    </header>

    <!-- Dropzone -->
    <div class="dropzone" id="dropzone">
      <i class="fa-solid fa-cloud-arrow-up"></i>
      <p>Arraste e solte seu arquivo <span>JSON</span> ou <span>Excel</span> aqui</p>
      <p style="font-size: 0.8rem; margin-top: 6px; color: var(--text-muted);">ou clique para navegar pelos arquivos do computador</p>
      <input type="file" id="fileInput" accept=".json, .xlsx, .xls">
    </div>

    <!-- Metrics Cards -->
    <div class="metrics-grid" id="metricsGrid" style="display: none;">
      <div class="metric-card">
        <div class="metric-info">
          <h3>Total de Membros</h3>
          <p id="totalMembros">0</p>
        </div>
        <div class="metric-icon" style="background: rgba(139, 92, 246, 0.12); color: var(--accent-purple);">
          <i class="fa-solid fa-users"></i>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-info">
          <h3>Meta Batida</h3>
          <p id="totalAprovados" style="color: var(--success);">0</p>
        </div>
        <div class="metric-icon" style="background: var(--success-bg); color: var(--success);">
          <i class="fa-solid fa-circle-check"></i>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-info">
          <h3>Abaixo da Meta</h3>
          <p id="totalReprovados" style="color: var(--danger);">0</p>
        </div>
        <div class="metric-icon" style="background: var(--danger-bg); color: var(--danger);">
          <i class="fa-solid fa-circle-xmark"></i>
        </div>
      </div>
    </div>

    <!-- Pódio -->
    <div id="podiumArea" style="display: none; margin-bottom: 30px;">
      <h3 style="margin-bottom: 14px; font-size: 0.95rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">
        <i class="fa-solid fa-crown" style="color: var(--accent-gold);"></i> Top Destaques da Guilda
      </h3>
      <div class="podium-container" id="podiumContent"></div>
    </div>

    <!-- Tabela Unificada com Todos os Controles Integrados -->
    <div class="table-container">
      <div class="table-header">
        <div class="table-title">
          <i class="fa-solid fa-list-check" style="color: var(--accent-purple);"></i> Lista de Membros
        </div>
        
        <div class="controls-wrapper">
          <!-- Meta Semanal -->
          <div class="control-group">
            <label><i class="fa-solid fa-coins"></i> Meta:</label>
            <input type="number" id="metaContrib" value="10000" min="0" step="500" onchange="atualizarRelatorio()">
          </div>

          <!-- Filtro de Status -->
          <div class="control-group">
            <label><i class="fa-solid fa-filter"></i> Status:</label>
            <select id="filtroStatus" onchange="filtrarTabela()">
              <option value="TODOS">Todos</option>
              <option value="OK">✅ Batida</option>
              <option value="FAIL">❌ Não Batida</option>
            </select>
          </div>

          <!-- Ordenação -->
          <div class="control-group">
            <label><i class="fa-solid fa-arrow-down-wide-short"></i> Ordenar:</label>
            <select id="ordenacao" onchange="filtrarTabela()">
              <option value="pontos-desc">Pontos (Maior)</option>
              <option value="pontos-asc">Pontos (Menor)</option>
              <option value="nome-asc">Nome (A - Z)</option>
              <option value="nome-desc">Nome (Z - A)</option>
              <option value="nivel-desc">Nível (Maior)</option>
              <option value="dailies-desc">Diárias (Maior)</option>
            </select>
          </div>

          <!-- Busca por Nick -->
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="buscaNome" placeholder="Buscar nick..." onkeyup="filtrarTabela()">
          </div>
        </div>
      </div>

      <div id="conteudoTabela">
        <div style="padding: 60px; text-align: center; color: var(--text-muted);">
          <i class="fa-solid fa-file-arrow-up" style="font-size: 3rem; margin-bottom: 14px; opacity: 0.5;"></i>
          <p style="font-weight: 500;">Nenhum arquivo importado ainda.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let dadosMembrosGlobais = [];
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');

    dropzone.addEventListener('click', () => fileInput.click());

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      window.addEventListener(eventName, e => e.preventDefault(), false);
      dropzone.addEventListener(eventName, e => e.preventDefault(), false);
    });

    ['dragenter', 'dragover'].forEach(eventName => {
      dropzone.addEventListener(eventName, () => dropzone.classList.add('dragover'), false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropzone.addEventListener(eventName, () => dropzone.classList.remove('dragover'), false);
    });

    dropzone.addEventListener('drop', e => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files.length) processarArquivo(files[0]);
    });

    fileInput.addEventListener('change', e => {
      if (e.target.files.length) processarArquivo(e.target.files[0]);
    });

    async function processarArquivo(file) {
      try {
        let membros = [];
        let guildName = "";

        if (file.name.endsWith('.json')) {
          const text = await file.text();
          const parsed = JSON.parse(text);
          membros = Array.isArray(parsed) ? parsed : (parsed.members || []);
          guildName = parsed.guild || "";
        } else {
          const data = await file.arrayBuffer();
          const workbook = XLSX.read(data);
          membros = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
        }

        dadosMembrosGlobais = membros.map(m => {
          const level = Number(m.level || m.Level || m.Nível || 0);
          const dailies = Number(m.dailiesCompleted || m.Dailies || m.Diárias || 0);
          
          let rawContrib = m.contribution || m.Contribuicao || m.Contribuição || 0;
          if (typeof rawContrib === 'string') {
            rawContrib = Number(rawContrib.replace(/[^0-9]/g, ''));
          } else {
            rawContrib = Number(rawContrib);
          }

          let valorPorDaily = 0;
          let tipoDaily = "Sem Daily";

          if (level >= 350) {
            valorPorDaily = 600;
            tipoDaily = "Primal (600 pts/daily)";
          } else if (level >= 150) {
            valorPorDaily = 300;
            tipoDaily = "Wildscape (300 pts/daily)";
          }

          const pontosDailies = dailies * valorPorDaily;
          const pontosTotais = pontosDailies + rawContrib;

          return {
            ...m,
            level,
            dailies,
            contribCash: rawContrib,
            pontosDailies,
            pontosTotais,
            valorPorDaily,
            tipoDaily
          };
        });

        const guildInfoElem = document.getElementById('guildInfo');
        if (guildInfoElem) {
          guildInfoElem.innerText = guildName 
            ? `Guilda: ${guildName} | Arquivo: ${file.name}` 
            : `Arquivo carregado: ${file.name}`;
        }
        
        document.getElementById('metricsGrid').style.display = 'grid';
        document.getElementById('podiumArea').style.display = 'block';
        atualizarRelatorio();
      } catch (err) {
        alert("Erro ao ler arquivo: " + err.message);
      }
    }

    function atualizarRelatorio() {
      if (!dadosMembrosGlobais.length) return;
      gerarPodio();
      filtrarTabela();
    }

    function gerarPodio() {
      const ordenados = [...dadosMembrosGlobais].sort((a, b) => b.pontosTotais - a.pontosTotais);
      const top3 = ordenados.slice(0, 3);
      let podioHtml = "";

      top3.forEach((m, idx) => {
        const classes = ['first', 'second', 'third'];
        const icones = ['1º', '2º', '3º'];

        podioHtml += `
          <div class="podium-card ${classes[idx]}">
            <div class="podium-icon">${icones[idx]}</div>
            <div style="flex: 1;">
              <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase;">${idx === 0 ? 'Líder do Ranking' : `${idx + 1}º Lugar`}</div>
              <strong style="font-size: 1.15rem; font-weight: 700;">${m.name || m.Nome}</strong>
              <div style="font-size: 0.9rem; color: var(--success); font-weight: 700; margin-top: 2px;">${m.pontosTotais.toLocaleString()} pts de Balance</div>
              <div class="detail-text">${m.dailies} Dailies (${m.pontosDailies.toLocaleString()} pts) + Cash: $${m.contribCash.toLocaleString()}</div>
            </div>
          </div>
        `;
      });

      document.getElementById('podiumContent').innerHTML = podioHtml;
    }

    function filtrarTabela() {
      const meta = Number(document.getElementById('metaContrib').value);
      const filtroStatus = document.getElementById('filtroStatus').value;
      const criterioOrdenacao = document.getElementById('ordenacao').value;
      const busca = document.getElementById('buscaNome').value.toLowerCase();

      let dadosFiltrados = dadosMembrosGlobais.filter(m => {
        const nome = (m.name || m.Nome || 'Desconhecido').toLowerCase();
        const bateuMeta = m.pontosTotais >= meta;

        const passaFiltro = (filtroStatus === 'TODOS') ||
                            (filtroStatus === 'OK' && bateuMeta) ||
                            (filtroStatus === 'FAIL' && !bateuMeta);

        const passaBusca = nome.includes(busca);
        return passaFiltro && passaBusca;
      });

      dadosFiltrados.sort((a, b) => {
        const nomeA = (a.name || a.Nome || '').toLowerCase();
        const nomeB = (b.name || b.Nome || '').toLowerCase();

        if (criterioOrdenacao === 'pontos-desc') return b.pontosTotais - a.pontosTotais;
        if (criterioOrdenacao === 'pontos-asc') return a.pontosTotais - b.pontosTotais;
        if (criterioOrdenacao === 'nome-asc') return nomeA.localeCompare(nomeB);
        if (criterioOrdenacao === 'nome-desc') return nomeB.localeCompare(nomeA);
        if (criterioOrdenacao === 'nivel-desc') return b.level - a.level;
        if (criterioOrdenacao === 'dailies-desc') return b.dailies - a.dailies;
        return 0;
      });

      let aprovados = 0;
      let reprovados = 0;
      let htmlLinhas = "";

      dadosMembrosGlobais.forEach(m => {
        if (m.pontosTotais >= meta) aprovados++; else reprovados++;
      });

      dadosFiltrados.forEach(m => {
        const nome = m.name || m.Nome || 'Desconhecido';
        const rank = m.rank || m.Cargo || '-';
        const bateuMeta = m.pontosTotais >= meta;
        const porcentagem = Math.min(100, Math.round((m.pontosTotais / meta) * 100));
        
        htmlLinhas += `
          <tr>
            <td>
              <b style="font-size: 0.95rem;">${nome}</b>
              <div class="detail-text">Lvl ${m.level} • ${m.tipoDaily}</div>
            </td>
            <td><span style="font-size: 0.75rem; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 6px; font-weight: 600; color: var(--text-muted);">${rank}</span></td>
            <td>
              <b style="font-size: 0.95rem;">${m.pontosTotais.toLocaleString()}</b> <span style="color: var(--text-muted); font-size: 0.8rem;">/ ${meta.toLocaleString()} pts</span>
              <div class="detail-text">${m.dailies} Dailies (+${m.pontosDailies.toLocaleString()} pts) | Cash: $${m.contribCash.toLocaleString()}</div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${porcentagem}%; background: ${bateuMeta ? 'var(--success)' : 'var(--accent-purple)'};"></div>
              </div>
            </td>
            <td><b style="font-weight: 700;">${porcentagem}%</b></td>
            <td>
              ${bateuMeta 
                ? '<span class="badge badge-success"><i class="fa-solid fa-check"></i> Meta Batida</span>' 
                : '<span class="badge badge-danger"><i class="fa-solid fa-xmark"></i> Não Bateu</span>'}
            </td>
          </tr>
        `;
      });

      document.getElementById('totalMembros').innerText = dadosMembrosGlobais.length;
      document.getElementById('totalAprovados').innerText = aprovados;
      document.getElementById('totalReprovados').innerText = reprovados;

      document.getElementById('conteudoTabela').innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Jogador / Nível</th>
              <th>Cargo</th>
              <th>Pontuação Total (Balance)</th>
              <th>Progresso</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            ${htmlLinhas}
          </tbody>
        </table>
      `;
    }
  </script>
</body>
</html>
